[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "onehealth-agents"
version = "0.1.0"
description = "EpiHack Arizona 2026 -- eight-agent OneHealth pipeline (intake, geo-enrichment, validation, triage, enrichment, notification, cluster detection, knowledge update). Wires community reports into typed observations and notifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = ["agents", "one-health", "epidemiology", "mcp", "anthropic", "claude", "epihack"]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onehealth_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
