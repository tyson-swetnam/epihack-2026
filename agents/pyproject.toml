[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "onehealth-agents"
version = "0.1.0"
description = "EpiHack Arizona 2026 -- eight-agent OneHealth pipeline (intake, geo-enrichment, validation, triage, enrichment, notification, cluster detection, knowledge update). Wires community reports into typed observations and notifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = ["agents", "one-health", "epidemiology", "mcp", "anthropic", "claude", "epihack"]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.2.0",
    # FastAPI intake API (api/openapi.yaml).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    # Supabase-issued JWT validation (plan/07-auth.md).
    "PyJWT[crypto]>=2.9",
    "email-validator>=2.2",
    # DuckLake knowledge-graph writes: the reports intake write-path
    # (kg_writer.py) and the DuckLakeAuditSink persist into the catalog.
    "duckdb>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # also used by fastapi.testclient
]

[project.scripts]
onehealth-api = "onehealth_agents.api:app"

[tool.hatch.build.targets.wheel]
packages = ["src/onehealth_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
