<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EpiHack Arizona 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      color: #1a1a1a;
      line-height: 1.55;
    }
    nav.crumbs { font-size: .9rem; color: #555; margin-bottom: 1rem; }
    nav.crumbs a { color: #1F3A93; text-decoration: none; }
    h1 { border-bottom: 3px solid #1F3A93; padding-bottom: .35rem; }
    h2 { margin-top: 2.25rem; color: #1F3A93; }
    h3 { margin-top: 1.25rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; }
    th, td { border: 1px solid #ddd; padding: .5rem .75rem; text-align: left; vertical-align: top; }
    th { background: #f0f3f8; }
    blockquote {
      border-left: 4px solid #1F3A93;
      background: #f4f6fb;
      margin: 1rem 0;
      padding: .75rem 1rem;
    }
    code { background: #f1f3f7; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    pre code { display: block; padding: .75rem 1rem; overflow-x: auto; }
    footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid #ddd; color: #666; font-size: .85rem; }
    a { color: #1F3A93; }
  </style>
</head>
<body>
  <nav class="crumbs">
    <a href="/epihack-2026/">EpiHack AZ 2026</a>
  </nav>

  ---
# Install Claude Code globally for the deploy user (no sudo on npm thanks
# to the per-user prefix from the `node` role) and drop a settings.json
# that wires the Anthropic API key + default model.

- name: Install Claude Code via npm
  become_user: ""
  community.general.npm:
    name: ""
    global: true
    state: latest
  environment:
    NPM_CONFIG_PREFIX: "/.npm-global"
    PATH: "/.npm-global/bin:/usr/local/bin:/usr/bin:/bin"

- name: Ensure ~/.claude exists
  become_user: ""
  ansible.builtin.file:
    path: "/.claude"
    state: directory
    mode: "0700"

- name: Write ~/.claude/settings.json
  become_user: ""
  ansible.builtin.template:
    src: settings.json.j2
    dest: "/.claude/settings.json"
    mode: "0600"

- name: Write the ANTHROPIC_API_KEY into the deploy user's env
  become_user: ""
  ansible.builtin.lineinfile:
    path: "/.bashrc"
    regexp: "^export ANTHROPIC_API_KEY="
    line: 'export ANTHROPIC_API_KEY=""'
    create: true
    mode: "0600"
  no_log: true

- name: Verify Claude Code is on PATH
  become_user: ""
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="/.npm-global/bin:$PATH"
    claude --version
  args:
    executable: /bin/bash
  register: claude_version
  changed_when: false

- name: Report Claude Code version
  ansible.builtin.debug:
    msg: "Claude Code: "


  <footer>
