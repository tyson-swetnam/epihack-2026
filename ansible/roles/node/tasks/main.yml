---
# Node.js {{ node_major_version }} LTS via NodeSource. Also configures the
# deploy user's npm prefix so global installs (Claude Code) don't need sudo.

- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
    force: false

- name: Add NodeSource apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Per-user npm prefix at ~/.npm-global
  become_user: "{{ onehealth_user }}"
  ansible.builtin.file:
    path: "{{ onehealth_home }}/.npm-global"
    state: directory
    mode: "0755"

- name: npm config — prefix
  become_user: "{{ onehealth_user }}"
  ansible.builtin.command: npm config set prefix "{{ onehealth_home }}/.npm-global"
  changed_when: false

- name: Add ~/.npm-global/bin to the deploy user's PATH
  become_user: "{{ onehealth_user }}"
  ansible.builtin.lineinfile:
    path: "{{ onehealth_home }}/.bashrc"
    line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
    create: true
    mode: "0644"
