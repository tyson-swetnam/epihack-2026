  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      color: #1a1a1a;
      line-height: 1.55;
    }
    nav.crumbs { font-size: .9rem; color: #555; margin-bottom: 1rem; }
    nav.crumbs a { color: #1F3A93; text-decoration: none; }
    h1 { border-bottom: 3px solid #1F3A93; padding-bottom: .35rem; }
    h2 { margin-top: 2.25rem; color: #1F3A93; }
    h3 { margin-top: 1.25rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; }
    th, td { border: 1px solid #ddd; padding: .5rem .75rem; text-align: left; vertical-align: top; }
    th { background: #f0f3f8; }
    blockquote {
      border-left: 4px solid #1F3A93;
      background: #f4f6fb;
      margin: 1rem 0;
      padding: .75rem 1rem;
    }
    code { background: #f1f3f7; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    pre code { display: block; padding: .75rem 1rem; overflow-x: auto; }
    footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid #ddd; color: #666; font-size: .85rem; }
    a { color: #1F3A93; }
  </style>
</head>
<body>
  <nav class="crumbs">
    <a href="/epihack-2026/">EpiHack AZ 2026</a>
  </nav>

  ---
# Put the project source at .
#
# Two modes, chosen by the shape of :
#   * Remote URL (https://, git@)  -> git clone/pull (force: true; the build
#     steps regenerate tracked lockfiles, so the tree is expected dirty).
#   * Local path (/..., file://)   -> rsync the working copy into place. This
#     is what the localhost inventory uses so iterative source edits (incl.
#     uncommitted changes) deploy without a push. Build artifacts are excluded
#     and preserved on the target across runs.

- name: Decide whether the source is a local path
  ansible.builtin.set_fact:
    repo_is_local: ""
    repo_local_src: ""

# --- Local working-copy mode -------------------------------------------------
- name: Ensure the target directory exists (local mode)
  when: repo_is_local
  ansible.builtin.file:
    path: ""
    state: directory
    owner: ""
    group: ""
    mode: "0755"

- name: Sync the local working copy into place (root reads src, excludes build dirs)
  when: repo_is_local
  ansible.builtin.command:
    cmd: >
      rsync -a --delete
      --exclude='.git/'
      --exclude='node_modules/'
      --exclude='.venv/'
      --exclude='__pycache__/'
      --exclude='.next/'
      --exclude='app/out/'
      --exclude='*.duckdb'
      --exclude='ansible/'
      / /
  register: repo_rsync
  changed_when: repo_rsync.stdout | length > 0
  # New source must reach the running API — restart it when the tree changes.
  notify: Restart fastapi

- name: Hand the synced tree to the deploy user (local mode)
  when: repo_is_local
  ansible.builtin.file:
    path: ""
    owner: ""
    group: ""
    recurse: true

# --- Remote git mode ---------------------------------------------------------
- name: Clone the repo (git mode)
  when: not repo_is_local
  become_user: ""
  ansible.builtin.git:
    repo: ""
    dest: ""
    version: ""
    update: true
    # This clone is disposable build source: `uv sync` / `npm install`
    # regenerate tracked lockfiles and dirty the tree, so reset on every run.
    force: true
  register: repo_clone
  notify: Restart fastapi

# --- Record what was deployed ------------------------------------------------
- name: Record the deployed source marker in /DEPLOYED_SHA
  become_user: ""
  ansible.builtin.copy:
    content: >-
      
    dest: "/DEPLOYED_SHA"
    mode: "0644"


  <footer>
    Source: Ending Pandemics Academy &middot; University of Arizona Mel &amp;
    Enid Zuckerman College of Public Health &middot; Global Health Institute.
  </footer>
</body>
</html>
