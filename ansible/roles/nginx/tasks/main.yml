<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EpiHack Arizona 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      color: #1a1a1a;
      line-height: 1.55;
    }
    nav.crumbs { font-size: .9rem; color: #555; margin-bottom: 1rem; }
    nav.crumbs a { color: #1F3A93; text-decoration: none; }
    h1 { border-bottom: 3px solid #1F3A93; padding-bottom: .35rem; }
    h2 { margin-top: 2.25rem; color: #1F3A93; }
    h3 { margin-top: 1.25rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; }
    th, td { border: 1px solid #ddd; padding: .5rem .75rem; text-align: left; vertical-align: top; }
    th { background: #f0f3f8; }
    blockquote {
      border-left: 4px solid #1F3A93;
      background: #f4f6fb;
      margin: 1rem 0;
      padding: .75rem 1rem;
    }
    code { background: #f1f3f7; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    pre code { display: block; padding: .75rem 1rem; overflow-x: auto; }
    footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid #ddd; color: #666; font-size: .85rem; }
    a { color: #1F3A93; }
  </style>
</head>
<body>
  <nav class="crumbs">
    <a href="/epihack-2026/">EpiHack AZ 2026</a>
  </nav>

  ---
# nginx serves the Next.js static export at / and reverse-proxies
# /api/ to the FastAPI uvicorn on 127.0.0.1.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Install certbot when TLS is enabled
  when: tls_enabled
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Write the onehealth nginx site
  ansible.builtin.template:
    src: onehealth.conf.j2
    dest: /etc/nginx/sites-available/onehealth.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable the onehealth nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/onehealth.conf
    dest: /etc/nginx/sites-enabled/onehealth.conf
    state: link
  notify: Reload nginx

- name: Test nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Issue / renew Let's Encrypt cert
  when: tls_enabled and vault_tls_email | length > 0
  ansible.builtin.command:
    cmd: >-
      certbot --nginx
      --non-interactive --agree-tos
      --email 
      --domains 
      --redirect
    creates: "/etc/letsencrypt/live//fullchain.pem"


  <footer>
    Source: Ending Pandemics Academy &middot; University of Arizona Mel &amp;
    Enid Zuckerman College of Public Health &middot; Global Health Institute.
  </footer>
</body>
</html>
