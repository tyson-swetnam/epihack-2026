---
# Provision the DuckLake knowledge-graph lakehouse:
#   * DuckDB CLI (operator shell) + query engine in the kg-mcp venv
#   * DuckLake catalog in the epihack Postgres DB (ACID metadata)
#   * Parquet data files under {{ ducklake_data_path }}
# then seed the schema once (idempotent). knowledge-graph-mcp reads this
# catalog at runtime; the FastAPI reports write-path + audit sink write to it.
#
# Runs after `repo` (schema files) + `postgres` (catalog DB) + `mcp_servers`
# (the kg-mcp venv that ships duckdb + the loader).

# --- DuckDB command-line shell (operator convenience) ------------------------
# Lets an operator `duckdb` into the DuckLake catalog directly. The runtime
# (kg-mcp + FastAPI write-path) uses the venv's duckdb, not this binary.
- name: Map host architecture to the DuckDB CLI asset name
  ansible.builtin.set_fact:
    duckdb_cli_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check the installed DuckDB CLI version (if any)
  ansible.builtin.command: duckdb --version
  register: duckdb_cli_installed
  changed_when: false
  failed_when: false

- name: Install the DuckDB CLI {{ duckdb_cli_version }}
  when: duckdb_cli_version not in (duckdb_cli_installed.stdout | default(''))
  block:
    - name: Ensure unzip is present (the DuckDB CLI ships as a .zip)
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: true

    - name: Download + unpack the DuckDB CLI to /usr/local/bin
      ansible.builtin.unarchive:
        src: "https://github.com/duckdb/duckdb/releases/download/v{{ duckdb_cli_version }}/duckdb_cli-linux-{{ duckdb_cli_arch }}.zip"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root

    - name: Ensure the DuckDB CLI is executable
      ansible.builtin.file:
        path: /usr/local/bin/duckdb
        mode: "0755"

- name: Create the DuckLake Parquet data directory
  ansible.builtin.file:
    path: "{{ ducklake_data_path }}"
    state: directory
    owner: "{{ onehealth_user }}"
    group: "{{ onehealth_group }}"
    mode: "0750"

# The seed script lives under roles/ducklake/files (in exouser's home, 0750),
# which the onehealth user can't read — copy it into onehealth-owned space.
- name: Stage the DuckLake bootstrap script
  ansible.builtin.copy:
    src: bootstrap_ducklake.py
    dest: "{{ onehealth_root }}/bootstrap_ducklake.py"
    owner: "{{ onehealth_user }}"
    group: "{{ onehealth_group }}"
    mode: "0755"

- name: Seed the DuckLake catalog (idempotent — skips if kg.node populated)
  become_user: "{{ onehealth_user }}"
  ansible.builtin.command:
    cmd: "{{ kg_mcp_venv_python }} {{ onehealth_root }}/bootstrap_ducklake.py"
  environment:
    KG_DUCKLAKE_URI: "{{ ducklake_uri }}"
    KG_DUCKLAKE_DATA_PATH: "{{ ducklake_data_path }}"
    KG_SCHEMA_PATH: "{{ onehealth_repo_path }}/schema"
  register: ducklake_seed
  changed_when: "'SEEDED:' in ducklake_seed.stdout"
  no_log: false

- name: Report DuckLake seed result
  ansible.builtin.debug:
    msg: "{{ ducklake_seed.stdout_lines }}"

# --- Optional: synthetic demo observations -----------------------------------
# Loads the 4,395-observation demo cohort under `source_fig='synthetic-load'`
# from scripts/load_synthetic_observations.py (idempotent — re-running deletes
# the prior batch first). Off by default; flip the toggle in host/group vars
# to seed the dashboard/signals/ page on a fresh provision. See
# plan/ANSIBLE-AUDIT-2026-05-23.md role 8 + plan/10-archival-and-docs.md
# Phase 7c.
- name: Load the synthetic demo observation cohort
  when: ducklake_load_synthetic_demo | bool
  become_user: "{{ onehealth_user }}"
  ansible.builtin.command:
    cmd: "{{ agents_venv_python | default(onehealth_repo_path + '/agents/.venv/bin/python') }} {{ onehealth_repo_path }}/scripts/load_synthetic_observations.py"
  environment:
    KG_DUCKLAKE_URI: "{{ ducklake_uri }}"
    KG_DUCKLAKE_DATA_PATH: "{{ ducklake_data_path }}"
  register: synthetic_load
  changed_when: "'persisted:' in synthetic_load.stdout"

- name: Report synthetic-cohort load result
  when: ducklake_load_synthetic_demo | bool
  ansible.builtin.debug:
    msg: "{{ synthetic_load.stdout_lines | default([]) }}"
