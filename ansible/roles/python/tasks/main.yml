---
# Python {{ python_version }} + uv. Ubuntu 24.04 ships Python 3.12 by default;
# on 22.04 we'd add deadsnakes — out of scope for the pilot.

- name: Ensure Python {{ python_version }} is installed
  ansible.builtin.apt:
    name:
      - "python{{ python_version }}"
      - "python{{ python_version }}-venv"
    state: present

- name: Install uv (system-wide) via the standalone installer
  # Install the real binaries straight into /usr/local/bin via UV_INSTALL_DIR.
  # Symlinking out of /root/.local/bin breaks for the unprivileged onehealth
  # user — root's home is 0700, so executing the symlink target gives EACCES.
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh \
      | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh -s -- --quiet
  args:
    creates: /usr/local/bin/uv
    executable: /bin/bash

- name: Verify uv is on PATH
  ansible.builtin.command: uv --version
  register: uv_version_check
  changed_when: false

- name: Report uv version
  ansible.builtin.debug:
    msg: "uv {{ uv_version_check.stdout }}"
