---
# FastAPI backend (agents/src/onehealth_agents/api/) under uvicorn,
# managed by systemd. Reads Supabase JWT config + Postgres DSN from
# the unit's environment file.

- name: uv sync the agents package
  become_user: "{{ onehealth_user }}"
  ansible.builtin.command:
    cmd: uv sync
    chdir: "{{ onehealth_repo_path }}/agents"
  # No `creates:` guard — uv sync is idempotent and fast, and we must pick up
  # dependency changes (e.g. duckdb for the DuckLake write-path) on re-deploy.
  register: agents_uv_sync
  changed_when: "'Installed' in agents_uv_sync.stderr or 'Prepared' in agents_uv_sync.stderr"
  notify: Restart fastapi
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"

- name: Create the DuckDB extension home for the API service
  ansible.builtin.file:
    path: "{{ ducklake_duckdb_home }}"
    state: directory
    owner: "{{ onehealth_user }}"
    group: "{{ onehealth_group }}"
    mode: "0750"

# Pre-install the ducklake + postgres extensions for the agents venv's exact
# duckdb version, so the running service never needs network at request time.
- name: Pre-install DuckDB extensions for the API's duckdb
  become_user: "{{ onehealth_user }}"
  ansible.builtin.command:
    cmd: >
      {{ onehealth_repo_path }}/agents/.venv/bin/python -c
      "import duckdb; c=duckdb.connect();
      c.execute('INSTALL ducklake'); c.execute('INSTALL postgres');
      c.execute('LOAD ducklake'); c.execute('LOAD postgres')"
  environment:
    HOME: "{{ ducklake_duckdb_home }}"
  register: ext_install
  changed_when: false

- name: Write the FastAPI env file
  ansible.builtin.template:
    src: onehealth-api.env.j2
    dest: /etc/onehealth-api.env
    owner: root
    group: "{{ onehealth_group }}"
    mode: "0640"
  notify: Restart fastapi
  no_log: true

- name: Install the systemd unit
  ansible.builtin.template:
    src: onehealth-api.service.j2
    dest: /etc/systemd/system/onehealth-api.service
    mode: "0644"
  notify: Restart fastapi

- name: Enable + start onehealth-api
  ansible.builtin.systemd:
    name: onehealth-api
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for the API to answer /v1/healthz
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ fastapi_bind_port }}/v1/healthz"
    status_code: 200
  register: api_health
  retries: 12
  delay: 2
  until: api_health.status == 200
