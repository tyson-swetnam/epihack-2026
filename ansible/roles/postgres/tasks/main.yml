---
# PostgreSQL {{ postgres_version }} + epihack DB + onehealth role.
# Bind only to 127.0.0.1; nginx never proxies to the DB.

- name: Install PostgreSQL {{ postgres_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
    state: present

- name: Ensure postgres is started + enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Bind only to {{ postgres_listen }}
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '{{ postgres_listen }}'"
  notify: Restart postgres

- name: Create onehealth Postgres role
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ vault_postgres_password }}"
    state: present

- name: Create epihack database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    encoding: UTF-8
    lc_collate: C.UTF-8
    lc_ctype: C.UTF-8
    template: template0
    state: present
