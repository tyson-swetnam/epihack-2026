<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DuckDB Query Console — EpiHack Arizona 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F3A93" />
<style>
  :root {
    --panel-w: 320px;
    --blue: #1F3A93;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  header {
    flex: 0 0 auto;
    padding: .7rem 1rem;
    border-bottom: 1px solid #d8dde6;
    background: #fff;
    z-index: 2;
  }
  header .crumbs { font-size: .82rem; color: #555; margin-bottom: .25rem; }
  header .crumbs a { color: var(--blue); text-decoration: none; }
  header h1 { margin: 0 0 .15rem 0; font-size: 1.15rem; color: var(--blue); }
  header p  { margin: 0; color: #555; font-size: .82rem; }

  main { flex: 1; display: flex; min-height: 0; position: relative; }

  /* Query catalog */
  #catalog {
    width: var(--panel-w);
    flex: 0 0 var(--panel-w);
    background: #fff;
    border-right: 1px solid #d8dde6;
    overflow-y: auto;
    padding: .85rem .9rem calc(.85rem + var(--safe-bottom));
    box-sizing: border-box;
    -webkit-overflow-scrolling: touch;
  }
  #catalog h3 {
    margin: 1.1rem 0 .4rem 0;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #555;
  }
  #catalog h3:first-child { margin-top: 0; }
  button.q {
    display: block;
    width: 100%;
    text-align: left;
    background: #f4f6fb;
    border: 1px solid #e0e5ee;
    border-radius: 6px;
    padding: .5rem .6rem;
    margin: 0 0 .4rem 0;
    cursor: pointer;
    font: inherit;
  }
  button.q:hover { background: #e9edf6; border-color: #c6cee0; }
  .q-name { display: block; font-weight: 600; font-size: .85rem; color: var(--blue); }
  .q-desc { display: block; font-size: .76rem; color: #666; margin-top: .15rem; line-height: 1.35; }

  /* Work area */
  #work {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #f7f8fb;
  }
  #editor-wrap { flex: 0 0 auto; padding: .8rem 1rem .4rem; }
  #editor {
    width: 100%;
    box-sizing: border-box;
    height: 9rem;
    resize: vertical;
    font-family: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: .85rem;
    line-height: 1.45;
    padding: .7rem .8rem;
    border: 1px solid #c6cee0;
    border-radius: 7px;
    background: #fff;
    color: #1a1a1a;
    tab-size: 2;
  }
  #bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: 0 1rem .4rem;
    flex-wrap: wrap;
  }
  button.action {
    font: inherit;
    font-weight: 600;
    font-size: .85rem;
    border: 0;
    border-radius: 6px;
    padding: .5rem .9rem;
    cursor: pointer;
  }
  #run { background: var(--blue); color: #fff; }
  #run:disabled { opacity: .55; cursor: default; }
  #download { background: #fff; color: var(--blue); border: 1px solid #c6cee0; }
  #download:disabled { opacity: .5; cursor: default; }
  .hint { font-size: .75rem; color: #888; }
  #meta { font-size: .8rem; color: #555; margin-left: auto; }

  #results-wrap { flex: 1; min-height: 0; overflow: auto; padding: 0 1rem 1rem; -webkit-overflow-scrolling: touch; }
  #results { background: #fff; border: 1px solid #e0e5ee; border-radius: 7px; }
  #results table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  #results th, #results td {
    border-bottom: 1px solid #eef1f6;
    padding: .42rem .6rem;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }
  #results th {
    position: sticky; top: 0;
    background: #f0f3f8;
    color: var(--blue);
    border-bottom: 2px solid #d8dde6;
  }
  #results tr:hover td { background: #f7f9fd; }
  #results td { font-variant-numeric: tabular-nums; }
  .empty { padding: 1rem; color: #888; font-size: .85rem; margin: 0; }

  .status { font-size: .82rem; padding: .4rem 1rem; border-top: 1px solid #d8dde6; background: #fff; flex: 0 0 auto; }
  .status.info  { color: #555; }
  .status.ok    { color: #2C5F2D; }
  .status.error { color: #C0392B; }

  @media (max-width: 820px) {
    body { overflow: auto; }
    main { flex-direction: column; }
    #catalog { width: 100%; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid #d8dde6; max-height: 40vh; order: 2; }
    #work { order: 1; }
    #results-wrap { overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <div class="crumbs"><a href="../index.html">EpiHack AZ 2026</a> &rsaquo; DuckDB query console</div>
  <h1>DuckDB query console <span style="font-weight:400;font-size:.8em;color:#888">(DuckDB-WASM)</span></h1>
  <p>The public reference knowledge graph (<code>kg.node</code> / <code>kg.edge</code> / <code>kg.property</code>), queried in your browser. Read-only — no individual reports, no server round-trip. <kbd>Ctrl/⌘ + Enter</kbd> to run.</p>
</header>
<main>
  <aside id="catalog" aria-label="Pre-written queries"></aside>
  <section id="work">
    <div id="editor-wrap">
      <textarea id="editor" spellcheck="false" aria-label="SQL editor"></textarea>
    </div>
    <div id="bar">
      <button id="run" class="action">Run ▸</button>
      <button id="download" class="action" disabled>Download CSV</button>
      <span class="hint">SELECT-only</span>
      <span id="meta"></span>
    </div>
    <div id="results-wrap"><div id="results"></div></div>
  </section>
</main>
<div id="status" class="status info">Starting…</div>

<script src="queries.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
