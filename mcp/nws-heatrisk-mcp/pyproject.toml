[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nws-heatrisk-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the U.S. National Weather Service public API (forecasts, alerts, observations) and the WPC HeatRisk gridded product. Built for EpiHack Arizona 2026."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = ["mcp", "nws", "weather", "heatrisk", "heat-health", "epidemiology", "one-health"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
nws-heatrisk-mcp = "nws_heatrisk_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nws_heatrisk_mcp"]
