[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mag-hrn-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Maricopa Association of Governments Heat Relief Network (cooling, hydration, respite, and donation sites in the Phoenix metro). Mock-by-default with an env-overridable ArcGIS Feature Service URL. Built for EpiHack Arizona 2026."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = [
    "mcp",
    "heat",
    "cooling-center",
    "hydration",
    "respite",
    "arizona",
    "phoenix",
    "maricopa",
    "one-health",
    "heat-relief",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
mag-hrn-mcp = "mag_hrn_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mag_hrn_mcp"]
