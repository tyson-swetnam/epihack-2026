[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wearable-mcp"
version = "0.1.0"
description = "Model Context Protocol server that exposes user-consented wearable readings (heart rate, skin temperature, HRV, steps) to LLM agents for the AZ One Health Sentinel Heat vertical. Mock-by-default; the real backend is the on-device store that app/shared/wearable.js populates from HealthKit / Health Connect. Built for EpiHack Arizona 2026 (Phase 4)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = ["mcp", "wearable", "healthkit", "health-connect", "loinc", "heat-illness", "one-health"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
wearable-mcp = "wearable_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wearable_mcp"]
