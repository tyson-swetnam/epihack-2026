[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "great-az-tick-check-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the UA Cooperative Extension Great Arizona Tick Check (Dr. Kathleen Walker lab). Mock-by-default backend; swap for a real API when one ships. Built for EpiHack Arizona 2026."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = [
    "mcp",
    "tick",
    "tick-borne",
    "rmsf",
    "rickettsia",
    "arizona",
    "one-health",
    "participatory-surveillance",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
great-az-tick-check-mcp = "great_az_tick_check_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/great_az_tick_check_mcp"]
