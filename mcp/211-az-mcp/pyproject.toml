[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "az211-mcp"
version = "0.1.0"
description = "Model Context Protocol server for 211 Arizona (Solari Crisis & Human Services) heat-relief, transport, utility-assistance, and crisis referrals. Mock-by-default; swap to a real backend via AZ211_BACKEND_URL. Built for EpiHack Arizona 2026."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpiHack Arizona 2026" }]
keywords = ["mcp", "211", "arizona", "solari", "heat-relief", "cooling-center", "liheap", "one-health"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
az211-mcp = "az211_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/az211_mcp"]
