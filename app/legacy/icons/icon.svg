<?xml version="1.0" encoding="UTF-8"?>
<!--
  AZ One Health Sentinel app icon (source).
  Square gradient (navy -> red, matching the landing-page hero), centered
  white "S" mark, with a small orange dot for the heat vertical.
  Rendered to 192x192 and 512x512 PNGs by tools/icons.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1F3A93"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Sentinel "S" mark, hand-tuned for legibility at 48px. -->
  <text x="50%" y="58%"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="320"
        fill="#ffffff">S</text>
  <!-- Heat-vertical accent dot. -->
  <circle cx="392" cy="120" r="40" fill="#E84A2B" stroke="#ffffff" stroke-width="6"/>
</svg>
